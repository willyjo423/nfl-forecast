name: Clock

# GitHub's scheduler runs this repo's crons hours late or not at all
# (2026-11-23: the 7am and 12:45pm forecast refreshes never fired). This job
# keeps its own time: it dispatches the daily NFL build and the NBA/NHL
# refreshes on schedule, then hands over to a fresh copy of itself before the
# 6-hour job limit, so nothing waits on GitHub's cron. The crons in daily.yml
# and sports.yml stay as a second line.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "23 13 * * *"     # restart, if the chain ever breaks

permissions:
  actions: write
  contents: read

concurrency:
  group: clock
  cancel-in-progress: false

jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Dispatch on time
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, subprocess, time
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          PT = ZoneInfo("America/Los_Angeles")
          PLAN = [("03:00", "daily.yml"),
                  ("07:17", "sports.yml"), ("12:43", "sports.yml"), ("15:07", "sports.yml")]
          def fire(wf):
              r = subprocess.run(["gh", "api", "-X", "POST",
                                  f"repos/{os.environ['REPO']}/actions/workflows/{wf}/dispatches",
                                  "-f", "ref=main"], capture_output=True, text=True)
              print(datetime.now(PT).strftime("%a %H:%M"), "dispatch", wf,
                    "ok" if r.returncode == 0 else r.stderr[:200], flush=True)
          start = time.time()
          now = datetime.now(PT)
          todo = []
          for day in (now.date(), now.date() + timedelta(days=1)):
              for hm, wf in PLAN:
                  h, m = map(int, hm.split(":"))
                  todo.append((datetime(day.year, day.month, day.day, h, m, tzinfo=PT), wf))
          todo.sort()
          # Catch up once: the most recent missed run of each workflow, if it
          # was due within the last 4 hours.
          for wf in {w for _, w in todo}:
              past = [a for a, w in todo if w == wf and a <= now]
              if past and now - past[-1] < timedelta(hours=4):
                  fire(wf)
          todo = [t for t in todo if t[0] > now]
          while True:
              left = 340 * 60 - (time.time() - start)
              if not todo or (todo[0][0] - datetime.now(PT)).total_seconds() > left:
                  time.sleep(max(left, 0))
                  print("handing over to a fresh clock run", flush=True)
                  fire("clock.yml")
                  break
              wait = (todo[0][0] - datetime.now(PT)).total_seconds()
              if wait > 0:
                  time.sleep(wait)
              at, wf = todo.pop(0)
              fire(wf)
          PY
